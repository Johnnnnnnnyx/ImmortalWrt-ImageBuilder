name: Build 25.12.x ISO x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "ImmortalWrt 版本"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - 25.12.2
          - 25.12.1
          - 25.12.0
      profile:
        description: "软件包空间大小"
        required: true
        default: "1G"
        type: choice
        options:
          - 1G
      include_docker:
        description: "是否额外集成 Docker"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go for the pinned QuickStart backend
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.12'
          cache: false

      - name: Build and test QuickStart ImmortalWrt compatibility fix
        run: sh x86-64/build-quickstart.sh

      - name: Test customization scripts
        run: |
          sh x86-64/test-ssh-qos.sh
          sh x86-64/test-custom25.sh
          sh x86-64/test-distfeeds.sh
          sh -n x86-64/99-zz-bypass
          sh -n x86-64/99-zzz-johnnywrt
          sh -n x86-64/johnny-ssh-qos
          sh -n x86-64/johnny-update
          sh -n x86-64/johnny-zt-nat
          sh -n x86-64/90-zerotier-rebind
          bash -n x86-64/build25.sh
          python3 -m py_compile x86-64/smoke-test25.py x86-64/test-sysupgrade.py

      - name: Build customized bypass firmware
        env:
          VERSION: ${{ inputs.luci_version }}
          SIZE: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
        run: |
          ROOTFS_SIZE=$(( ${SIZE%G} * 1024 ))
          docker run --rm \
            --user root \
            -v "$GITHUB_WORKSPACE/bin:/home/build/immortalwrt/bin" \
            -v "$GITHUB_WORKSPACE/files:/home/build/immortalwrt/files" \
            -v "$GITHUB_WORKSPACE/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "$GITHUB_WORKSPACE/shell:/home/build/immortalwrt/shell" \
            -v "$GITHUB_WORKSPACE/x86-64:/home/build/immortalwrt/custom25:ro" \
            -v "$GITHUB_WORKSPACE/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="$ROOTFS_SIZE" \
            -e INCLUDE_DOCKER="$INCLUDE_DOCKER" \
            -e ENABLE_PPPOE=no -e PPPOE_ACCOUNT= -e PPPOE_PASSWORD= \
            -e BUILD_ID="${{ github.sha }}" \
            -e RELEASE_TAG="Johnnywrt-ISO-${{ inputs.luci_version }}-${{ github.run_number }}" \
            -e CUSTOM_BYPASS=1 \
            "immortalwrt/imagebuilder:x86-64-openwrt-$VERSION" \
            /bin/bash /home/build/immortalwrt/build.sh
          sudo chown -R "$(id -u):$(id -g)" bin

      - name: Verify required firmware packages
        run: |
          manifest=$(find bin/targets/x86/64 -maxdepth 1 -name '*.manifest' -print -quit)
          test -n "$manifest"
          for package in meowx-core meowx luci-app-meowx luci-i18n-meowx-zh-cn zerotier luci-app-zerotier luci-app-store quickstart luci-app-quickstart luci-theme-aurora luci-mod-rpc luci-lib-ipkg luci-compat; do
            grep -E "^${package} - " "$manifest" || exit 1
          done
          grep '^kernel - ' "$manifest"

      - name: Boot firmware and test defaults
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf xorriso squashfs-tools
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          test -n "$image"
          python3 x86-64/smoke-test25.py "$image"

      - name: Verify retained-settings upgrades and real SSH login
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install paramiko==3.5.1
          mkdir -p previous-release
          gh release download Johnnywrt-ISO-25.12.2-5 --repo "${{ github.repository }}" --pattern Johnnywrt-x86_64.iso --pattern SHA256SUMS --dir previous-release
          (cd previous-release && sha256sum -c SHA256SUMS)
          xorriso -osirrox on -indev previous-release/Johnnywrt-x86_64.iso -extract /live/filesystem.squashfs previous-release/root.squashfs
          unsquashfs -cat previous-release/root.squashfs mnt/custom.img > previous-release/base.img
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          python3 x86-64/test-sysupgrade.py previous-release/base.img "$image"

      - name: Build ISO installer from verified firmware
        run: |
          git clone https://github.com/wukongdaily/img-installer.git
          git -C img-installer checkout 361ea6138094a2417e62edd01f73fa1160e93e01
          chmod +x img-installer/supportFiles/custom/build.sh
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          cp "$image" firmware-for-iso.img.gz
          cd img-installer
          bash autobuild/autobuild.sh ../firmware-for-iso.img.gz

      - name: Verify ISO boot catalog and embedded firmware
        env:
          VERSION: ${{ inputs.luci_version }}
          SIZE: ${{ inputs.profile }}
          RELEASE_TAG: Johnnywrt-ISO-${{ inputs.luci_version }}-${{ github.run_number }}
        run: |
          iso=img-installer/output/custom-installer-x86_64.iso
          test -s "$iso"
          xorriso -indev "$iso" -report_el_torito plain 2>&1 | tee iso-boot-catalog.txt
          grep 'BIOS' iso-boot-catalog.txt
          grep 'UEFI' iso-boot-catalog.txt
          xorriso -osirrox on -indev "$iso" -extract /live/filesystem.squashfs iso-filesystem.squashfs
          image=$(find bin/targets/x86/64 -maxdepth 1 -name '*squashfs-combined-efi.img.gz' -print -quit)
          expected=$(gzip -dc "$image" | sha256sum | cut -d ' ' -f1)
          actual=$(unsquashfs -cat iso-filesystem.squashfs mnt/custom.img | sha256sum | cut -d ' ' -f1)
          test "$expected" = "$actual"
          echo "PASS: ISO contains the exact boot-tested firmware ($actual)"
          cd img-installer/output
          mv custom-installer-x86_64.iso Johnnywrt-x86_64.iso
          cp "$GITHUB_WORKSPACE/$image" Johnnywrt-x86_64-squashfs-combined-efi.img.gz
          cp "$GITHUB_WORKSPACE"/bin/targets/x86/64/*.manifest .
          jq -n --arg tag "$RELEASE_TAG" --arg version "$VERSION" --arg commit "${{ github.sha }}" --argjson rootfs_mb "$(( ${SIZE%G} * 1024 ))" \
            '{tag:$tag,version:$version,commit:$commit,target:"x86/64",format:"squashfs-combined-efi",rootfs_mb:$rootfs_mb}' > firmware.json
          sha256sum Johnnywrt-x86_64.iso *squashfs-combined-efi.img.gz *.manifest firmware.json > SHA256SUMS

      - name: Save build and boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-diagnostics-${{ github.run_number }}
          path: |
            bin/targets/x86/64/*.manifest
            bin/targets/x86/64/boot-test.log
            bin/targets/x86/64/upgrade-test.log
            bin/targets/x86/64/upgrade-test-screen.ppm
            bin/targets/x86/64/upgrade-failed.img.gz
            bin/targets/x86/64/profiles.json
            iso-boot-catalog.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare ISO release notes
        env:
          VERSION: ${{ inputs.luci_version }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
        run: |
          cat > "$GITHUB_WORKSPACE/router-info.md" <<EOF
          ## Johnnywrt UEFI 安装与升级固件 — 基于 ImmortalWrt $VERSION x86-64

          - 网页升级：选择 squashfs-combined-efi.img.gz 并保留配置，不要上传 ISO；保持与原设备相同的根分区大小。
          - 系统 → Johnnywrt 在线更新：固定检查本仓库，下载 SHA256 和系统校验通过后，确认保留配置升级。同系列、同分区布局才允许在线升级，不强制刷写。
          - UEFI 全新安装：使用下方 ISO 安装器，或解压 combined-efi.img.gz 后直接写入新磁盘；两种方式均使用 UEFI 启动（不含 Secure Boot 签名保证）。
          - 本版通过 Dropbear 原生 -z 修复 SSH 优先级标记兼容性，首次安装及保留配置升级均生效，不修改认证或绑定。
          - 构建使用当前 MeowX OpenWrt 签名源，插件与核心的实际版本见本发布 manifest；不混用桌面/Android 版本号。
          - 已通过一次性虚拟机中的旧版到新版、新版到新版保留配置升级和真实 SSH 登录检查。
          - 维护方法见 Johnny 分支 AGENTS.md、MAINTENANCE.md；保留旧发布用于恢复。源码：${{ github.sha }}。


          - 虚拟机选择 UEFI 启动，挂载 ISO，并准备至少 8 GB 虚拟硬盘。
          - 启动后输入 ddd，选择目标虚拟硬盘安装；安装完成后卸载 ISO，从硬盘启动。安装会清空所选硬盘。
          - 默认通过主路由 DHCP 获取管理地址；请在主路由租约列表查找 Johnnywrt。
          - 自身 DHCP 服务已关闭，物理网口加入 LAN；首次使用只连接一个网口到现有局域网。
          - 用户名 root，初始无密码；首次登录后请设置密码。
          - 内置 MeowX（含核心和中文界面）、ZeroTier、iStore、首页和网络向导；NAS 菜单隐藏。
          - 默认使用 Aurora 1.4.0 主题。
          - 内置 luci-mod-rpc、luci-lib-ipkg 和 luci-compat；LuCI RPC 随 Web 服务启动。系统使用 APK，旧 ipkg RPC 的软件包管理功能仍依赖 opkg，不能据此认定兼容 APK。
          - 页面默认名称 Johnnywrt，使用原始 Johnny Logo 标签页图标；底层版本信息保持 ImmortalWrt，避免软件源及内核包不匹配。
          - 软件源校正为 ImmortalWrt 官方源，保留版本号、架构和内核 ABI；构建中实际更新列表并安装匹配内核的测试模块。
          - 修复首页误报“软件源错误”：检测实际 APK 索引，不再访问不存在的 .asc 文件；切换菜单只提供 ImmortalWrt 官方源及中科大 ImmortalWrt 镜像。切换保留当前版本、内核 ABI 和第三方源，并同步保存镜像设置。
          - QuickStart 后端使用固定的 0.13.0 公开源码提交 fa23fc8 加软件源修复，标识 johnny-feeds-1；已运行上游 Go 测试和固件内 API 检查。
          - 已预装 zashboard 3.29.1 完整面板及字体，无需首次打开时下载；导入订阅并启动 MeowX 后可打开面板。
          - 同时内置 GeoIP、GeoSite 和 ASN 数据并校验 SHA256；MeowX 两种地理数据模式已通过下载地址不可用时的配置测试。订阅本身和自定义远程规则仍需联网。
          - ZeroTier 网络 ID 留空。在 VPN → ZeroTier 的 earth 网络中填写 ID 并保存应用，再到管理中心授权。
          - ZeroTier 接口自动关联，允许与 LAN 双向转发；仅对 ZeroTier 进入本机直接连接的 IPv4 LAN 的流量做源地址转换，帮助局域网设备回包。防火墙重载及 LAN 改地址后自动刷新。
          - 两地均使用此旁路由时：客户端网关指向本地旁路由，ZeroTier 管理中心配置两地托管路由并授权节点。无需修改主路由，也无需给 NAS 添加回程路由；访问记录中看到的是本地旁路由地址。
          - 不内置个人网络 ID、节点密钥、站点 IP 或密码，不接管 ZeroTier 默认路由或 DNS。保留配置升级时仍保留原有 LAN 与 ZeroTier 设置。
          - Docker: $INCLUDE_DOCKER
          - 镜像已通过软件包清单检查及 QEMU 启动检查；实机网卡和两地联通性需部署后验证。
          EOF

      - name: Publish verified firmware
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Johnnywrt-ISO-${{ inputs.luci_version }}-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Johnnywrt ${{ inputs.luci_version }} UEFI Install + Upgrade (${{ github.run_number }})
          body_path: router-info.md
          fail_on_unmatched_files: true
          files: |
            img-installer/output/Johnnywrt-x86_64.iso
            img-installer/output/*squashfs-combined-efi.img.gz
            img-installer/output/*.manifest
            img-installer/output/firmware.json
            img-installer/output/SHA256SUMS
